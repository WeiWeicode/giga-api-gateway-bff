# :9443 Agent 專用通道:mTLS 必要 + gRPC(PRD §7.6、ARCHITECTURE.md D3)。
# 以 IP 存取時無法以 SNI 區分,改用獨立 port;瀏覽器存取 :443 不會被要求出示憑證。

server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/ssl.conf;
    ssl_client_certificate /etc/nginx/pki/agent-ca-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/pki/agent.crl;

    access_log /dev/stdout json_agent;

    # 長連線(Agent 端 30 秒 keepalive ping)與重連風暴保護
    keepalive_timeout 1h;
    client_body_timeout 1h;
    grpc_read_timeout 1h;
    grpc_send_timeout 1h;
    limit_conn agent_conn 10;
    # 串流的 body 是整條串流累計;沿用全域 10m 會在長連線上傳滿 10 MB 時被切斷(RST_STREAM)。
    # 單則訊息大小由 Endpoint Server 的 MaxRecvMsgSize 限制(ENDPOINT-AGENT-GUIDE.md §5)
    client_max_body_size 0;

    location / {
        # 只接受 Agent 專用中繼 CA 簽發的裝置憑證($agent_issuer_ok 定義於 conf.d/00-env.conf)
        if ($agent_issuer_ok = 0) {
            return 403;
        }
        grpc_set_header x-client-cert-dn $ssl_client_s_dn;
        grpc_set_header x-client-cert-fp $ssl_client_fingerprint;
        grpc_set_header x-client-verify $ssl_client_verify;
        grpc_set_header x-request-id $request_id;
        grpc_ssl_trusted_certificate /etc/nginx/pki/ca.crt;
        grpc_ssl_verify on;
        grpc_ssl_server_name on;
        grpc_pass grpcs://$endpoint_grpc_upstream;
    }
}
