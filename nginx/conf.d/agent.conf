# :9443 Agent 專用通道:mTLS 必要 + HTTPS 回報 / WebSocket 指令(PRD §7.6、ARCHITECTURE.md D3、ENDPOINT-AGENT-GUIDE.md §4)。
# 以 IP 存取時無法以 SNI 區分,改用獨立 port;瀏覽器存取 :443 不會被要求出示憑證。
# HTTP/1.1:Nginx 不支援以 HTTP/2 承載 WebSocket,本 server 不開 http2。

server {
    listen 9443 ssl;
    listen 19443 ssl proxy_protocol;
    server_name _;

    include /etc/nginx/snippets/ssl.conf;
    # Agent 以 IP 連線,伺服器憑證與 :443 分開(SAN 帶 IP;Q1)
    ssl_certificate /etc/nginx/pki/agent-server.crt;
    ssl_certificate_key /etc/nginx/pki/agent-server.key;
    ssl_client_certificate /etc/nginx/pki/agent-ca-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/pki/agent.crl;

    access_log /dev/stdout json_agent;

    # 長連線:任一方向超過 1 小時沒有資料就中斷(Agent 每 30 秒應用層心跳,指南 §5.3)
    keepalive_timeout 1h;
    client_body_timeout 1h;
    limit_conn agent_conn 10;
    # 單則訊息 / 請求上限由 Endpoint Server 設定(指南 §4)
    client_max_body_size 0;

    location / {
        # 只接受 Agent 專用中繼 CA 簽發的裝置憑證($agent_issuer_ok 定義於 conf.d/00-env.conf)
        if ($agent_issuer_ok = 0) {
            return 403;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 身分標頭一律由 Nginx 覆寫,Agent 自己送的同名標頭無效(指南 §4.1)
        proxy_set_header x-client-cert-dn $ssl_client_s_dn;
        proxy_set_header x-client-cert-fp $ssl_client_fingerprint;
        proxy_set_header x-client-verify $ssl_client_verify;
        proxy_set_header x-request-id $request_id;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Nginx → Endpoint Server 以 TLS 連線,並以根 CA 驗證其憑證(SAN 含 endpoint-server;指南 §5.1)
        proxy_ssl_trusted_certificate /etc/nginx/pki/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_pass https://$endpoint_agent_upstream;
    }
}
