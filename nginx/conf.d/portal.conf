# :80 轉址、:443 瀏覽器與系統對系統(PRD §7.1–§7.5)。以 IP 存取,server_name 不限。

server {
    listen 80 default_server;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/json-errors.conf;
    limit_req zone=gw_ip burst=100 nodelay;

    # ---------------- SPA(PRD §7.2;/srv/www/<app>/current 為 symlink,部署時原子切換) ----------------

    # 入口網:/(含 /login、/register、/reset-password 等前端頁面)
    location / {
        root /srv/www/portal/current;
        try_files $uri $uri/ /index.html =404;
        include /etc/nginx/snippets/spa-html.conf;
    }
    location /assets/ {
        root /srv/www/portal/current;
        try_files $uri =404;
        include /etc/nginx/snippets/spa-assets.conf;
    }

    # 各系統子路徑(新系統上線前登記,PRD §7.2.1)
    # History 模式:找不到檔案時回傳該系統的 index.html(alias 與 try_files 的回退 URI 併用有已知問題,改以 named location 處理)
    location = /mes { return 301 /mes/; }
    location /mes/assets/ { alias /srv/www/mes/current/assets/; include /etc/nginx/snippets/spa-assets.conf; }
    location /mes/ { alias /srv/www/mes/current/; try_files $uri $uri/ @mes_index; include /etc/nginx/snippets/spa-html.conf; }
    location @mes_index { root /srv/www/mes/current; try_files /index.html =404; include /etc/nginx/snippets/spa-html.conf; }

    location = /hrm { return 301 /hrm/; }
    location /hrm/assets/ { alias /srv/www/hrm/current/assets/; include /etc/nginx/snippets/spa-assets.conf; }
    location /hrm/ { alias /srv/www/hrm/current/; try_files $uri $uri/ @hrm_index; include /etc/nginx/snippets/spa-html.conf; }
    location @hrm_index { root /srv/www/hrm/current; try_files /index.html =404; include /etc/nginx/snippets/spa-html.conf; }

    location = /fms { return 301 /fms/; }
    location /fms/assets/ { alias /srv/www/fms/current/assets/; include /etc/nginx/snippets/spa-assets.conf; }
    location /fms/ { alias /srv/www/fms/current/; try_files $uri $uri/ @fms_index; include /etc/nginx/snippets/spa-html.conf; }
    location @fms_index { root /srv/www/fms/current; try_files /index.html =404; include /etc/nginx/snippets/spa-html.conf; }

    location = /it { return 301 /it/; }
    location /it/assets/ { alias /srv/www/it-admin/current/assets/; include /etc/nginx/snippets/spa-assets.conf; }
    location /it/ { alias /srv/www/it-admin/current/; try_files $uri $uri/ @it_index; include /etc/nginx/snippets/spa-html.conf; }
    location @it_index { root /srv/www/it-admin/current; try_files /index.html =404; include /etc/nginx/snippets/spa-html.conf; }
    # IT 管理系統(GigaItApp,取代範例 IT 頁面):自有登入、不共用單一入口,API /it/api/* 直接轉給 itapp-api(不經 BFF)
    # 上游以變數指定(ITAPP_API_UPSTREAM),尚未部署時 Nginx 仍可啟動,請求回 502
    location /it/api/ {
        include /etc/nginx/snippets/proxy-bff.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$itapp_api_upstream;
    }
    location = /it/api/auth/login {
        limit_req zone=gw_ip burst=100 nodelay;
        limit_req zone=gw_auth burst=4 nodelay;
        include /etc/nginx/snippets/proxy-bff.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$itapp_api_upstream;
    }

    location = /bi { return 301 /bi/; }
    location /bi/assets/ { alias /srv/www/bi/current/assets/; include /etc/nginx/snippets/spa-assets.conf; }
    location /bi/ { alias /srv/www/bi/current/; try_files $uri $uri/ @bi_index; include /etc/nginx/snippets/spa-html.conf; }
    location @bi_index { root /srv/www/bi/current; try_files /index.html =404; include /etc/nginx/snippets/spa-html.conf; }

    # ---------------- API(PRD §7.3:所有 /api/* 一律轉給 BFF,由 BFF 依路由表轉上游) ----------------

    location /api/ {
        include /etc/nginx/snippets/proxy-bff.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://bff_upstream;
    }

    # 登入、註冊、密碼:較嚴格的 IP 限流,保護 AD 帳號不被鎖定
    location ~ ^/api/auth/(login|register|password/) {
        limit_req zone=gw_ip burst=100 nodelay;
        limit_req zone=gw_auth burst=4 nodelay;
        include /etc/nginx/snippets/proxy-bff.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://bff_upstream;
    }

    # ---------------- WebSocket(PRD §7.4) ----------------

    location = /ws/notify {
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass http://bff_upstream;
    }

    # 串流 WebSocket:auth_request 向 BFF 驗證一次後直連 Endpoint Server(ARCHITECTURE.md D2)
    location /ws/endpoint/ {
        auth_request /_auth/verify;
        auth_request_set $gw_auth_user $upstream_http_x_auth_user;
        auth_request_set $gw_internal_token $upstream_http_x_internal_token;
        error_page 401 = @unauthenticated;
        error_page 403 = @permission_denied;
        include /etc/nginx/snippets/websocket.conf;
        proxy_set_header X-Auth-User $gw_auth_user;
        proxy_set_header X-Internal-Token $gw_internal_token;
        proxy_pass http://$endpoint_ws_upstream;
    }

    location = /_auth/verify {
        internal;
        error_page 404 = @route_not_found;
        proxy_pass http://bff_upstream/_auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /_auth/ {
        default_type application/json;
        return 404 '{"code":"ROUTE_NOT_FOUND","message":"找不到此 API","requestId":"$request_id"}';
    }

    # ---------------- Webhook(PRD §7.5:IP 白名單,不經 JWT) ----------------

    location /webhook/ {
        default_type application/json;
        if ($webhook_bpm_allowed = 0) {
            add_header X-Request-Id $request_id always;
            return 403 '{"code":"IP_NOT_ALLOWED","message":"來源 IP 不允許","requestId":"$request_id"}';
        }
        include /etc/nginx/snippets/proxy-bff.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://bff_upstream;
    }

    # ---------------- 內網專用:JWKS、健康檢查、文件、指標 ----------------

    location ~ ^/(\.well-known/jwks\.json|readyz|docs|metrics)$ {
        if ($internal_service_client = 0) {
            return 404;
        }
        include /etc/nginx/snippets/proxy-bff.conf;
        proxy_pass http://bff_upstream;
    }

    location = /healthz {
        default_type application/json;
        access_log off;
        return 200 '{"status":"ok","component":"nginx"}';
    }
}

# nginx-prometheus-exporter 讀取(不對外公開 port)
server {
    listen 8081;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
