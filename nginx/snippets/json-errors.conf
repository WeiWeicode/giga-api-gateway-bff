# Nginx 自行拒絕的請求以統一 JSON 回應(PRD §8.1.1),不回預設 HTML 錯誤頁
error_page 413 @payload_too_large;
error_page 429 @rate_limited;
error_page 502 504 @bff_unavailable;
error_page 503 @bff_unavailable;

location @payload_too_large {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"請求內容過大","requestId":"$request_id"}';
}
location @rate_limited {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"code":"RATE_LIMITED","message":"請求過於頻繁,請稍後再試","requestId":"$request_id"}';
}
location @bff_unavailable {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 502 '{"code":"UPSTREAM_ERROR","message":"系統暫時無法使用","requestId":"$request_id"}';
}
location @unauthenticated {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 401 '{"code":"UNAUTHENTICATED","message":"請先登入","requestId":"$request_id"}';
}
location @permission_denied {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 403 '{"code":"PERMISSION_DENIED","message":"您沒有此功能的權限","requestId":"$request_id"}';
}
location @route_not_found {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    return 404 '{"code":"ROUTE_NOT_FOUND","message":"找不到此 API","requestId":"$request_id"}';
}
