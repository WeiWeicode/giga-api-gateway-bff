# 轉給 BFF 的共通設定(PRD §7.3)
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $request_id;
# 清除用戶端送入的內部身分標頭,避免偽造(BFF 轉給上游前會再清除所有 X-Internal-* / X-User-* / X-Auth-*)
proxy_set_header X-Internal-Token "";
proxy_set_header X-Internal-User "";
proxy_set_header X-Auth-User "";
proxy_set_header X-User-Id "";
proxy_set_header X-User-Emp "";
proxy_set_header X-User-Name "";
proxy_set_header X-User-Dept "";
proxy_set_header X-User-Roles "";
proxy_connect_timeout 3s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_hide_header X-Powered-By;
proxy_hide_header X-Request-Id;
