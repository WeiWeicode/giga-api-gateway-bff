# GigaNexus Gateway — Nginx 主設定(PRD §7、ARCHITECTURE.md)
# 以 IP 存取(PRD Q1)::80 轉址、:443 瀏覽器與系統、:9443 Agent 專用 mTLS
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 10m;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # 容器內 Docker DNS(以變數指定上游時使用,例如 Endpoint Server 可能尚未部署)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # JSON access log(PRD §7.7);Agent 通道另含 ssl_client_s_dn
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    log_format json_agent escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"uri":"$request_uri","status":$status,"request_time":$request_time,"upstream_addr":"$upstream_addr",'
        '"ssl_client_s_dn":"$ssl_client_s_dn","ssl_client_verify":"$ssl_client_verify"}';
    access_log /dev/stdout json;
    # 另寫一份到共用 volume,給 nginx-log-agent 每分鐘彙總流量與來源 IP(MONITORING-PLAN D4);agent 會在檔案過大時截斷
    access_log /var/log/nginx-gw/access.json json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    # map 鍵值較長(Agent 中繼 CA 的 Subject DN,allowlists/*/agent-issuers.conf);預設 64 會 nginx -t 失敗
    map_hash_bucket_size 256;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 來源 IP(DEPLOYMENT.md §6.1):主機上的 L4 轉送(主機 2 為 Traefik)連到 10080 / 10443 / 19443 並以 PROXY protocol 帶入來源 IP,
    # realip 以此取代 $remote_addr(限流、白名單 geo、log、X-Forwarded-For 皆使用);只有走 PROXY protocol 的連線會被改寫,
    # 80 / 443 / 9443(CI 冒煙測試、同主機容器)維持原本的連線位址
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header proxy_protocol;

    # Agent 通道(:9443)以裝置憑證指紋計算同時串流數,不以來源 IP:Docker Desktop 轉送或子公司 NAT 時
    # 多台電腦共用同一來源 IP(DEPLOYMENT.md §6.1);Agent 與 Watchdog 使用同一張電腦憑證,共用額度
    limit_conn_zone $ssl_client_fingerprint zone=agent_conn:10m;
    limit_conn_status 429;

    # BFF 多實例(DEPLOYMENT.md §3.2 逐一更新時不中斷)
    upstream bff_upstream {
        server bff-1:3000 max_fails=2 fail_timeout=5s;
        server bff-2:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
