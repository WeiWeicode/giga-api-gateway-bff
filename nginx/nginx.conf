# GigaNexus Gateway — Nginx 主設定(PRD §7、ARCHITECTURE.md)
# 以 IP 存取(PRD Q1)::80 轉址、:443 瀏覽器與系統、:9443 Agent 專用 mTLS
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 10m;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # 容器內 Docker DNS(以變數指定上游時使用,例如 Endpoint Server 可能尚未部署)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # JSON access log(PRD §7.7);Agent 通道另含 ssl_client_s_dn
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    log_format json_agent escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"uri":"$request_uri","status":$status,"request_time":$request_time,"upstream_addr":"$upstream_addr",'
        '"ssl_client_s_dn":"$ssl_client_s_dn","ssl_client_verify":"$ssl_client_verify"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 第一道限流(PRD §7.3):全域以 IP 為鍵;登入 / 註冊 / 密碼 API 另設嚴格限流(速率見 conf.d/00-env.conf)
    limit_req_zone $binary_remote_addr zone=gw_ip:20m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=agent_conn:10m;
    limit_conn_status 429;

    # BFF 多實例(DEPLOYMENT.md §3.2 逐一更新時不中斷)
    upstream bff_upstream {
        server bff-1:3000 max_fails=2 fail_timeout=5s;
        server bff-2:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
