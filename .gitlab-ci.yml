# GigaNexus Gateway Pipeline(DEPLOYMENT.md §2)
#   check        所有分支:lint、型別、單元測試、2012 語法檢查、nginx -t
#   build        develop / main:建置 bff、nginx 映像檔並推送(tag = commit SHA)
#   deploy-test  develop 自動部署測試區(主機 2,windows-runner)
#   deploy-prod  main 手動核可部署正式區(主機 3,prod-deploy,Protected);拉取與測試區相同 SHA 的映像檔
#
# Runner:主機 2 WSL(Ubuntu)內的 Linux shell executor(GITLAB-SETUP.md §3),tag windows-runner。
# 測試區 / 正式區主機上需有:${GW_DEPLOY_DIR}/<區域>.env、${GW_SECRETS_DIR}、${GW_CONFIG_DIR}/ldap-domains.json(DEPLOYMENT.md §5)。
# build 另將 web-kit 與 deploy/ 複製到 ${GW_SHARED_DIR}(同一台主機上 giga-Portal 建置、套用權限時使用)。

stages: [check, build, deploy-test, deploy-prod]

variables:
  BFF_IMAGE: $CI_REGISTRY_IMAGE/gateway/bff
  NGINX_IMAGE: $CI_REGISTRY_IMAGE/gateway/nginx
  COMPOSE: docker compose -f deploy/docker-compose.yml
  # 主機上的共用目錄(主機 2:/srv/giganexus/shared,擁有者 gitlab-runner)
  GW_SHARED_DIR: /srv/giganexus/shared/giga-api-gateway-bff

.windows-runner: &windows-runner
  tags: [windows-runner]

check:bff:
  <<: *windows-runner
  stage: check
  image: node:22-alpine
  script:
    - cd bff
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run db:check-2012
    - npm test

check:nginx:
  <<: *windows-runner
  stage: check
  script:
    # nginx -t 需要憑證與可解析的上游主機:以一次性臨時自簽憑證(deploy/gen-temp-pki.sh)與假 host 檢查設定
    # 容器以 root 寫入工作目錄:結束前改回 Runner 使用者擁有,否則下一個 job 的 git clean 刪不掉而整條 Pipeline 失敗
    - docker run --rm -v "$CI_PROJECT_DIR:/repo" -w /repo -e GATEWAY_IPS=127.0.0.1 -e GW_ENV=ci alpine:3.20 sh -c "apk add -q openssl && OUT=/repo/.ci-secrets sh deploy/gen-temp-pki.sh; rc=\$?; chown -R $(id -u):$(id -g) /repo/.ci-secrets; exit \$rc"
    - docker build -t gw-nginx-check:$CI_COMMIT_SHORT_SHA nginx/
    - docker run --rm --add-host bff-1:127.0.0.1 --add-host bff-2:127.0.0.1 -e GW_ENV=test -v "$CI_PROJECT_DIR/.ci-secrets/pki:/etc/nginx/pki:ro" gw-nginx-check:$CI_COMMIT_SHORT_SHA nginx -t

build:
  <<: *windows-runner
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # giga-Portal 建置需要 web-kit 原始碼、套用權限需要 deploy/:放到同主機共用目錄(先寫暫存目錄再替換)
    - |
      if [ -d "$(dirname "$GW_SHARED_DIR")" ]; then
        rm -rf "$GW_SHARED_DIR.new" && mkdir -p "$GW_SHARED_DIR.new/web-kit"
        cp -r web-kit/src "$GW_SHARED_DIR.new/web-kit/src" && cp -r deploy "$GW_SHARED_DIR.new/deploy"
        rm -rf "$GW_SHARED_DIR" && mv "$GW_SHARED_DIR.new" "$GW_SHARED_DIR"
      else
        echo "警告:$(dirname "$GW_SHARED_DIR") 不存在,略過共用目錄"
      fi
    # main 以 fast-forward 合併時,映像檔已由 develop 建置,直接沿用
    - |
      if docker manifest inspect --insecure "$BFF_IMAGE:$CI_COMMIT_SHA" >/dev/null 2>&1; then
        echo "映像檔已存在,略過建置"; exit 0
      fi
    # --pull:一律以 Registry 的官方基底映像建置;主機上的 node:22-alpine 等標籤可能被其他專案覆寫(2026-10-02 發生,NODE_ENV=production 導致 tsc 不存在)
    - docker build --pull -f bff/Dockerfile -t "$BFF_IMAGE:$CI_COMMIT_SHA" .
    - docker build --pull -t "$NGINX_IMAGE:$CI_COMMIT_SHA" nginx/
    - docker push "$BFF_IMAGE:$CI_COMMIT_SHA"
    - docker push "$NGINX_IMAGE:$CI_COMMIT_SHA"

.deploy: &deploy
  script:
    - test -f "$GW_DEPLOY_DIR/$GW_ENV.env" || { echo "缺少 $GW_DEPLOY_DIR/$GW_ENV.env" >&2; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # shell 環境變數優先於 env 檔:Pipeline 以此覆寫 REGISTRY / IMAGE_TAG;COMPOSE_ENV_FILES 讓 wait-healthy.sh 的 compose 指令也讀到 env 檔
    - export IMAGE_TAG=$CI_COMMIT_SHA REGISTRY=$CI_REGISTRY_IMAGE COMPOSE_ENV_FILES="$GW_DEPLOY_DIR/$GW_ENV.env"
    - C="$COMPOSE -f deploy/docker-compose.$GW_ENV.yml"
    - $C pull
    # 1. migration(失敗即中止)
    - $C run --rm migrate
    # 2. Redis(BFF 以 --no-deps 更新,不會帶起相依服務;第一次部署或 Redis 停止時由此啟動,已在執行則不變)
    - $C up -d --wait redis
    # 3. BFF 逐一更新,等待 /readyz
    - $C up -d --no-deps bff-1
    - sh deploy/wait-healthy.sh bff-1
    - $C up -d --no-deps bff-2
    - sh deploy/wait-healthy.sh bff-2
    # 3a. worker(BullMQ 等待執行中的工作完成後才結束,stop_grace_period 60 秒)
    - $C up -d --no-deps worker
    # 4. Nginx(重建容器,WebSocket 會短暫斷線;正式區安排離峰)
    #    2026-10-01 起 :9443 讀 pki/agent-server.crt/key;舊 pki/ 沒有時由 server.* 補上(與 gen-temp-pki.sh 相同,只補一次)
    - S="$(sed -n 's/^GW_SECRETS_DIR=//p' "$GW_DEPLOY_DIR/$GW_ENV.env")"
    - docker run --rm -v "$S/pki:/pki" alpine:3.20 sh -c 'cd /pki && { [ -f agent-server.crt ] || { cp server.crt agent-server.crt && cp server.key agent-server.key && chmod 600 agent-server.key && echo "已補上 pki/agent-server.crt/key"; }; }'
    - $C up -d --no-deps nginx
    # 4a. Nginx 指標(W3-2.8;讀取 nginx:8081/stub_status)
    - $C up -d --no-deps nginx-exporter
    # 5. 記錄已部署版本(giga-Portal 套用權限時以同一個映像執行 CLI)
    - echo "$CI_COMMIT_SHA" > "$(dirname "$GW_SHARED_DIR")/gateway-image-tag"
    # 6. 冒煙測試
    - sh deploy/smoke-test.sh "https://127.0.0.1"

deploy-test:
  <<: *deploy
  stage: deploy-test
  tags: [windows-runner]
  variables:
    GW_ENV: test
    GW_DEPLOY_DIR: /srv/giganexus/deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test }

deploy-prod:
  <<: *deploy
  stage: deploy-prod
  tags: [prod-deploy]
  variables:
    GW_ENV: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment: { name: production }
